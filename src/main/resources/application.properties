spring.application.name=Rest
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rest_app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.ddl-auto=validate

jwt_secret=${JWT_SECRET:secret}

# Сериализация дат как ISO-8601 строки (нужно для iOS JSON декодера)
spring.jackson.serialization.write-dates-as-timestamps=false

# DeepSeek AI — вставь свой токен сюда
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.url=${DEEPSEEK_API_URL:https://api.deepseek.com/v1/chat/completions}
deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}
openrouter.http.referer=${OPENROUTER_HTTP_REFERER:}
openrouter.x.title=${OPENROUTER_X_TITLE:Cloffy}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO
logging.level.com.fasterxml.jackson=WARN
logging.level.org.springframework.http.converter.json=WARN

server.forward-headers-strategy=framework

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ????????? ???? ? UI
springdoc.swagger-ui.path=/swagger-ui.html
# ???? ? JSON ????????????
springdoc.api-docs.path=/api-docs
# ?????????? ??? ????????? ??????? Spring Security
springdoc.show-actuator=true
